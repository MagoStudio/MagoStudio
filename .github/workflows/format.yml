name: Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check formatting with the locked oxfmt version
        run: |
          OXFMT_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/oxfmt'].version")
          npx --yes "oxfmt@$OXFMT_VERSION" --check .
